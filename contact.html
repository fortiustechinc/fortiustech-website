<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Fortius Technologies Inc</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="sub-page">
    <header>
        <div class="container">
            <a href="index.html">
                <img src="logo.png" alt="Fortius Technologies Logo" class="logo">
            </a>
            <nav id="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>
    
    <main>
        <section class="hero right-align">
            <h1>Contact Us</h1>
            <p>Ready to build your infrastructure? Reach out today.</p>
        </section>
        
        <section id="contact" class="container" style="padding: 50px 20px;">
            <div class="contact-container">
                <div class="contact-form">
                    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message:</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="cta">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 Fortius Technologies Inc. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('mobile-menu');
            const nav = document.getElementById('main-nav').querySelector('ul');
            if (menuToggle && nav) {
                menuToggle.addEventListener('click', () => {
                    nav.classList.toggle('open');
                    menuToggle.classList.toggle('open');
                });
            }
        });
    </script>
</body>
</html>
